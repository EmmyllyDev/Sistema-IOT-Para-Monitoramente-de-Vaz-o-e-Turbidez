{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGUÁ — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, body { font-family: 'Inter', sans-serif; }

        body {
            background: #0f2744;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f2744;
            letter-spacing: 0.05em;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-top: 3px;
        }

        .divider {
            height: 1px;
            background: #f1f5f9;
            margin: 24px 0;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }

        .form-control {
            font-size: 0.875rem;
            border-color: #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            color: #0f172a;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .input-group .form-control { border-right: none; }
        .input-group .btn-eye {
            border: 1px solid #e2e8f0;
            border-left: none;
            border-radius: 0 8px 8px 0;
            background: #fff;
            color: #94a3b8;
            padding: 0 12px;
        }
        .input-group .btn-eye:hover { color: #475569; }

        .btn-login {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 0.875rem;
            font-weight: 600;
            width: 100%;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #1d4ed8; color: #fff; }

        .alert {
            font-size: 0.82rem;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .footer-note {
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-2">
        <img src="{% static 'img/Logo.png' %}" alt="SIGUÁ" style="width:100px; height:auto; margin-bottom:10px;">
        <div class="brand-sub">ETA Júlio Campos · DAE Várzea Grande — MT</div>
    </div>

    <div class="divider"></div>


    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-danger mb-3" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>{{ msg }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control"
                   placeholder="Nome de usuário" autofocus autocomplete="username">
        </div>

        <div class="mb-4">
            <label class="form-label">Senha</label>
            <div class="input-group">
                <input type="password" name="password" id="inputSenha"
                       class="form-control" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="btn-eye" onclick="toggleSenha()">
                    <i class="bi bi-eye" id="iconeSenha"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-login">
            Entrar
        </button>
    </form>

    <div class="footer-note">
        Acesso restrito a operadores autorizados.
    </div>
</div>

<script>
function toggleSenha() {
    const input = document.getElementById('inputSenha');
    const icone = document.getElementById('iconeSenha');
    if (input.type === 'password') {
        input.type = 'text';
        icone.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icone.className = 'bi bi-eye';
    }
}
</script>

</body>
</html>
